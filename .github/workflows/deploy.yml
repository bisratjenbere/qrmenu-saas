name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/qrmenu?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/qrmenu?schema=public
      JWT_SECRET: ci-placeholder-secret
      API_URL: http://localhost:3001
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run build
