api:
  dashboard: false

providers:
  docker:
    exposedByDefault: false
    network: qrmenu-network

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https

  websecure:
    address: ":443"

certificatesResolvers:
  myresolver:
    acme:
      email: admin@demo.com
      storage: "/letsencrypt/acme.json"
      httpChallenge:
        entryPoint: web
